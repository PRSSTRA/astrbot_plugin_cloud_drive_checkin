name: PR 校验

on:
  pull_request:
    branches: [master, 'dev/**']

jobs:
  pr-title:
    name: PR 标题规范
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 校验标题
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$TITLE" > /tmp/msg
          bash .githooks/commit-msg /tmp/msg

  commit-msg:
    name: 提交信息规范
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 逐个校验
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          fail=0
          for sha in $(git rev-list "$base..$head"); do
            git log -1 --format=%B "$sha" > /tmp/msg
            bash .githooks/commit-msg /tmp/msg || fail=1
          done
          exit $fail
