name: PR 校验

on:
  pull_request:
    branches:
      - master
      - 'dev/**'
    types:
      - opened
      - synchronize
      - reopened
      - edited

permissions:
  contents: read

jobs:
  pr-title:
    name: PR 标题规范
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 校验标题与分支
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          title_file=$(mktemp)
          trap 'rm -f -- "$title_file"' EXIT
          printf '%s\n' "$PR_TITLE" > "$title_file"
          bash scripts/check-pr-policy.sh title "$title_file"
          bash scripts/check-pr-policy.sh branch "$BASE_BRANCH" "$HEAD_BRANCH"

  commit-msg:
    name: 提交信息规范
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装插件宿主依赖
        run: python3 -m pip install -r requirements.txt
      - name: 运行策略回归测试
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: 逐个校验
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          bash scripts/check-pr-policy.sh commits "$BASE_SHA" "$HEAD_SHA"
