name: PR 校验

on:
  pull_request:
    branches:
      - master
      - 'dev/**'
    types:
      - opened
      - synchronize
      - reopened
      - edited

permissions:
  contents: read

jobs:
  pr-title:
    name: PR 标题规范
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 校验标题与分支
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          title_file=$(mktemp)
          trap 'rm -f -- "$title_file"' EXIT
          printf '%s\n' "$PR_TITLE" > "$title_file"
          bash scripts/check-pr-policy.sh title "$title_file"
          bash scripts/check-pr-policy.sh branch "$BASE_BRANCH" "$HEAD_BRANCH"

  tests:
    name: 离线测试 (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 确认 Python 与 Node 运行时
        run: |
          python3 --version
          node --version
      - name: 安装插件宿主依赖
        run: python3 -m pip install -r requirements.txt
      - name: 运行全量离线测试
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

  tianyi:
    name: 天翼脚本离线测试 (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: 创建脚本专用测试环境并校验依赖哈希
        working-directory: third_party/tianyi
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --require-hashes --only-binary=:all: -r requirements.lock
      - name: 运行天翼脚本禁网回归
        working-directory: third_party/tianyi
        run: .venv/bin/python -m unittest discover -s tests -v
      - name: 准备锁定 wheel 并构建独立制品
        run: |
          python3 -m pip download --require-hashes --only-binary=:all: --dest "$RUNNER_TEMP/tianyi-wheels" -r third_party/tianyi/requirements.lock
          python3 scripts/prepare-tianyi.py --wheelhouse "$RUNNER_TEMP/tianyi-wheels" --output "$RUNNER_TEMP/tianyi.pyz"
      - name: 禁网运行实际制品并检查结果
        run: |
          python3 -I - "$RUNNER_TEMP/tianyi.pyz" <<'PY'
          import contextlib
          import io
          import json
          import os
          import runpy
          import sys

          attempts = []
          def deny_network(event, arguments):
              if event in {"socket.connect", "socket.getaddrinfo", "socket.sendto"}:
                  attempts.append(event)
                  raise RuntimeError("artifact smoke forbids network")
          sys.addaudithook(deny_network)
          os.environ["TY_ACCOUNTS"] = json.dumps([{"username": "FAKE_USER", "password": "FAKE_PASSWORD"}])
          os.environ["TG_BOT_TOKEN"] = ""
          os.environ["TG_CHAT_ID"] = ""
          output, errors = io.StringIO(), io.StringIO()
          with contextlib.redirect_stdout(output), contextlib.redirect_stderr(errors):
              runpy.run_path(sys.argv[1], run_name="__main__")
          assert len(attempts) == 1, "expected one blocked request, no retry"
          assert json.loads(output.getvalue()) == {"status": "unknown"}
          assert errors.getvalue() == ""
          print("artifact dependencies loaded; network denied; safe unknown result")
          PY

  commit-msg:
    name: 提交信息规范
    needs: [tests, tianyi]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 要求所有运行时测试通过
        env:
          TEST_RESULT: ${{ needs.tests.result }}
          TIANYI_RESULT: ${{ needs.tianyi.result }}
        run: test "$TEST_RESULT" = success && test "$TIANYI_RESULT" = success
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 逐个校验
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          bash scripts/check-pr-policy.sh commits "$BASE_SHA" "$HEAD_SHA"
